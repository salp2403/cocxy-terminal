name: Prepare Release

# Bumps `Resources/Info.plist` to the target version, commits the bump
# to `main`, and creates the release tag on top of that commit. The
# existing `Release` workflow takes it from there through a second,
# default-branch repository dispatch.
#
# Separating the bump from the release build closes the historical
# drift where `git checkout <tag>` returned source with the previous
# release's `Info.plist`. After this workflow runs, the tag points at
# a commit whose `Info.plist` matches the shipped DMG exactly, so
# source-only checkouts, audits, and forensic bisects reproduce what
# GitHub Releases publishes.
#
# The workflow accepts only a repository dispatch, so GitHub loads this
# privileged definition from the default branch. Safety guards reject
# invalid formats, existing tags, and anything other than trusted
# `main`. All operations are idempotent — re-running for the same
# version with a matching `Info.plist` is a no-op.

on:
  repository_dispatch:
    types:
      - prepare-stable-release

permissions:
  contents: write

jobs:
  prepare:
    name: Bump Info.plist and tag
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Validate version format
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected semver format X.Y.Z (no leading v)."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Release preparation is not running from its default-branch event commit."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Refuse if tag already exists
        run: |
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::error::Tag v${VERSION} already exists. Pick a different version or delete the tag manually if this was intentional."
            exit 1
          fi

      - name: Read current Info.plist version
        id: current
        run: |
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Current Info.plist version is invalid: ${CURRENT}"
            exit 1
          fi
          IFS=. read -r candidate_major candidate_minor candidate_patch <<< "$VERSION"
          IFS=. read -r current_major current_minor current_patch <<< "$CURRENT"
          candidate_major=$((10#$candidate_major))
          candidate_minor=$((10#$candidate_minor))
          candidate_patch=$((10#$candidate_patch))
          current_major=$((10#$current_major))
          current_minor=$((10#$current_minor))
          current_patch=$((10#$current_patch))
          if [ "$candidate_major" -lt "$current_major" ] \
              || { [ "$candidate_major" -eq "$current_major" ] \
                  && [ "$candidate_minor" -lt "$current_minor" ]; } \
              || { [ "$candidate_major" -eq "$current_major" ] \
                  && [ "$candidate_minor" -eq "$current_minor" ] \
                  && [ "$candidate_patch" -lt "$current_patch" ]; }; then
            echo "::error::Target version ${VERSION} is older than current Info.plist version ${CURRENT}."
            exit 1
          fi
          echo "CURRENT=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Info.plist currently at ${CURRENT}"

      - name: Bump Info.plist (idempotent)
        run: |
          plutil -replace CFBundleVersion -string "${VERSION}" Resources/Info.plist
          plutil -replace CFBundleShortVersionString -string "${VERSION}" Resources/Info.plist
          echo "Info.plist now at ${VERSION}"

      - name: Configure committer
        run: |
          git config user.name "Said Arturo Lopez"
          git config user.email "dev@cocxy.dev"

      - name: Commit bump (skip if clean)
        id: commit
        run: |
          if git diff --quiet Resources/Info.plist; then
            echo "SKIPPED=1" >> "$GITHUB_OUTPUT"
            echo "Info.plist already at ${VERSION}; reusing the current HEAD for the tag."
          else
            git add Resources/Info.plist
            git commit -m "chore(release): bump Info.plist to ${VERSION}"
            echo "SKIPPED=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        run: |
          git tag -a "v${VERSION}" -m "Cocxy Terminal v${VERSION}"

      - name: Push main then tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          # Push main first so the tagged commit is reachable on the
          # default branch before dispatching the trusted Release workflow.
          # Pushing the tag second guarantees that provenance validation can
          # resolve an annotated tag whose commit is already visible on main.
          #
          # The PAT is exposed only to this push step. GitHub suppresses
          # derived workflow triggers for pushes made with GITHUB_TOKEN.
          ASKPASS="$RUNNER_TEMP/cocxy-prepare-release-git-askpass"
          cat > "$ASKPASS" <<'ASKPASS_EOF'
          #!/bin/bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          if [ "${{ steps.commit.outputs.SKIPPED }}" = "0" ]; then
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
          fi
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin "v${VERSION}"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=stable-release \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=v${VERSION}" \
            -f "client_payload[commit]=${RELEASE_COMMIT}"

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.SKIPPED }}" = "1" ]; then
            echo "### Release v${VERSION} tagged (no bump needed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release v${VERSION} prepared" >> "$GITHUB_STEP_SUMMARY"
            echo "- Info.plist: ${{ steps.current.outputs.CURRENT }} → ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit pushed to \`main\` and tagged as \`v${VERSION}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- The \`Release\` workflow will now build, sign, notarize, and publish the DMG." >> "$GITHUB_STEP_SUMMARY"
