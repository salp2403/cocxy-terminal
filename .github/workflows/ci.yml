name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Unprivileged)
    runs-on: macos-15
    # Debug build, release build, 3158 XCTest cases and 585 serialised Swift
    # Testing suites land at roughly 43 minutes, so a 45 minute cap cancelled
    # healthy runs whenever a runner was a few minutes slower than usual.
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install Zig 0.15.2
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2

      - name: Install pinned XcodeGen
        run: |
          XCODEGEN_BIN="$(./scripts/install-pinned-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.45.3")"
          echo "$XCODEGEN_BIN" >> "$GITHUB_PATH"

      - name: Build
        run: swift build --disable-automatic-resolution -c debug

      - name: Test
        run: ./scripts/run-tests.sh

      - name: Build Release
        run: swift build --disable-automatic-resolution -c release

      - name: Prepare inert CI remote-daemon fixture
        run: ./scripts/prepare-ci-cocxycore-fixture.sh "$RUNNER_TEMP/cocxycore-ci-fixture"

      - name: Build App Bundle
        env:
          COCXYCORE_DIR: ${{ runner.temp }}/cocxycore-ci-fixture
          COCXY_CI_REMOTE_DAEMON_FIXTURE: "1"
        run: ./scripts/build-app.sh release

      - name: Verify App Bundle
        run: ./scripts/verify-app-bundle.sh build/CocxyTerminal.app

      - name: Privacy Audit
        run: ./scripts/run-privacy-audit.sh --app build/CocxyTerminal.app

  bounded-process-containment:
    name: Bounded Process Containment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep containment mandatory on both the oldest and newest current hosted macOS images.
        os: [macos-15, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          persist-credentials: false

      - name: Test launchd process containment
        run: ./scripts/run-filtered-swift-testing.sh NotebookProcessRunnerSwiftTestingTests

  trusted-bundle-audit:
    name: Full Bundle Audit (Trusted Main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: Install Zig 0.15.2
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2

      - name: Install pinned XcodeGen
        run: |
          XCODEGEN_BIN="$(./scripts/install-pinned-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.45.3")"
          echo "$XCODEGEN_BIN" >> "$GITHUB_PATH"

      - name: Checkout pinned CocxyCore source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: salp2403/cocxycore
          path: cocxycore-source
          ref: 5b1a6ecf1c96bb74a2921e92bad1e52664f83673
          ssh-key: ${{ secrets.COCXYCORE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Build App Bundle with pinned CocxyCore
        env:
          COCXYCORE_DIR: ${{ github.workspace }}/cocxycore-source
        run: ./scripts/build-app.sh release

      - name: Verify App Bundle
        run: ./scripts/verify-app-bundle.sh build/CocxyTerminal.app

      - name: Privacy Audit
        run: ./scripts/run-privacy-audit.sh --app build/CocxyTerminal.app
