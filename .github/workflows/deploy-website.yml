name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to write into website placeholders. Defaults to the latest GitHub release."
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-website:
    name: Deploy cocxy.dev website
    runs-on: macos-15
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web

      - name: Resolve website version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid website version: ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and verify website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run smoke
          npm audit --audit-level=high
          npm audit signatures
          npm run smoke:visual
          npm run audit:quality:full
          mkdir -p ../build/es
          node scripts/generate-releases-page.mjs \
            --version "${{ steps.version.outputs.VERSION }}" \
            --locale en \
            --output ../build/releases.html
          node scripts/generate-releases-page.mjs \
            --version "${{ steps.version.outputs.VERSION }}" \
            --locale es \
            --output ../build/es/releases.html
        working-directory: web

      - name: Deploy website
        env:
          SERVER_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          ASSET_VERSION="${VERSION}-${GITHUB_SHA::12}"
          echo "$SERVER_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          DEPLOY_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          case "$DEPLOY_PATH" in
            */) ;;
            *) DEPLOY_PATH="${DEPLOY_PATH}/" ;;
          esac
          BACKUP_NAME="cocxy-web-backup-${GITHUB_RUN_ID}-$(date -u +%Y%m%d%H%M%S).tar.gz"

          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ${DEPLOY_TARGET} \
            "set -e; \
             mkdir -p ${DEPLOY_PATH} ${DEPLOY_PATH}css ${DEPLOY_PATH}js ${DEPLOY_PATH}images ${DEPLOY_PATH}es ${DEPLOY_PATH}videos ${DEPLOY_PATH}og ${DEPLOY_PATH}features ${DEPLOY_PATH}docs ${DEPLOY_PATH}es/features ${DEPLOY_PATH}es/docs; \
             tar -czf /tmp/${BACKUP_NAME} -C ${DEPLOY_PATH} ."

          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/*.html ${DEPLOY_TARGET}:${DEPLOY_PATH}
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/css/* ${DEPLOY_TARGET}:${DEPLOY_PATH}css/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/js/* ${DEPLOY_TARGET}:${DEPLOY_PATH}js/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/images/* ${DEPLOY_TARGET}:${DEPLOY_PATH}images/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/og/* ${DEPLOY_TARGET}:${DEPLOY_PATH}og/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/features/*.html ${DEPLOY_TARGET}:${DEPLOY_PATH}features/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/docs/*.html ${DEPLOY_TARGET}:${DEPLOY_PATH}docs/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/docs/search-index.json ${DEPLOY_TARGET}:${DEPLOY_PATH}docs/search-index.json
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/videos/* ${DEPLOY_TARGET}:${DEPLOY_PATH}videos/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/robots.txt ${DEPLOY_TARGET}:${DEPLOY_PATH}robots.txt
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/sitemap.xml ${DEPLOY_TARGET}:${DEPLOY_PATH}sitemap.xml
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/manifest.webmanifest ${DEPLOY_TARGET}:${DEPLOY_PATH}manifest.webmanifest
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/llms.txt ${DEPLOY_TARGET}:${DEPLOY_PATH}llms.txt
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/feed.xml ${DEPLOY_TARGET}:${DEPLOY_PATH}feed.xml
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/releases.xml ${DEPLOY_TARGET}:${DEPLOY_PATH}releases.xml
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/service-worker.js ${DEPLOY_TARGET}:${DEPLOY_PATH}service-worker.js
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/es/*.html ${DEPLOY_TARGET}:${DEPLOY_PATH}es/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/es/features/*.html ${DEPLOY_TARGET}:${DEPLOY_PATH}es/features/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/public/es/docs/*.html ${DEPLOY_TARGET}:${DEPLOY_PATH}es/docs/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            build/releases.html ${DEPLOY_TARGET}:${DEPLOY_PATH}releases.html
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            build/es/releases.html ${DEPLOY_TARGET}:${DEPLOY_PATH}es/releases.html

          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ${DEPLOY_TARGET} \
            "set -e; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|CocxyTerminal-[0-9]*\.[0-9]*\.[0-9]*\.dmg|CocxyTerminal-${VERSION}.dmg|g'; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/CocxyTerminal-|releases/download/v${VERSION}/CocxyTerminal-|g'; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|>v[0-9]*\.[0-9]*\.[0-9]*<|>v${VERSION}<|g'; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|Download v[0-9]*\.[0-9]*\.[0-9]*|Download v${VERSION}|g; s|Descargar v[0-9]*\.[0-9]*\.[0-9]*|Descargar v${VERSION}|g'; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|style.css?v=[0-9A-Za-z._-]*|style.css?v=${ASSET_VERSION}|g'; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|cocxy-preview.avif?v=[0-9A-Za-z._-]*|cocxy-preview.avif?v=${ASSET_VERSION}|g; s|cocxy-preview.webp?v=[0-9A-Za-z._-]*|cocxy-preview.webp?v=${ASSET_VERSION}|g; s|cocxy-preview.png?v=[0-9A-Za-z._-]*|cocxy-preview.png?v=${ASSET_VERSION}|g'; \
             find ${DEPLOY_PATH} -type f -name '*.html' -print0 | xargs -0 sed -i 's|\"softwareVersion\": \"[0-9]*\.[0-9]*\.[0-9]*\"|\"softwareVersion\": \"${VERSION}\"|g'; \
             sed -i 's|cocxy-web-static-v[0-9A-Za-z._-]*|cocxy-web-static-v${ASSET_VERSION}|g' ${DEPLOY_PATH}service-worker.js; \
             sed -i 's|style.css?v=[0-9A-Za-z._-]*|style.css?v=${ASSET_VERSION}|g; s|cocxy-preview.avif?v=[0-9A-Za-z._-]*|cocxy-preview.avif?v=${ASSET_VERSION}|g; s|cocxy-preview.webp?v=[0-9A-Za-z._-]*|cocxy-preview.webp?v=${ASSET_VERSION}|g; s|cocxy-preview.png?v=[0-9A-Za-z._-]*|cocxy-preview.png?v=${ASSET_VERSION}|g' ${DEPLOY_PATH}service-worker.js; \
             sed -i 's|Version: [0-9]*\.[0-9]*\.[0-9]*|Version: ${VERSION}|g' ${DEPLOY_PATH}llms.txt; \
             if find ${DEPLOY_PATH} \( -name '*.html' -o -name 'llms.txt' -o -name 'service-worker.js' \) -print0 | xargs -0 grep -F 'v0.0.0'; then echo 'unresolved version placeholder in deployed website'; exit 1; fi"

          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            web/server.js web/package.json web/package-lock.json web/ecosystem.config.js \
            web/scripts/restart-production-runtime.sh \
            ${DEPLOY_TARGET}:${DEPLOY_PATH}
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ${DEPLOY_TARGET} \
            "set -e; \
             export PATH=\"\$HOME/.npm-global/bin:\$HOME/.npm/bin:\$HOME/.local/bin:\$HOME/.nvm/current/bin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:\$PATH\"; \
             if [ -s \"\$HOME/.nvm/nvm.sh\" ]; then . \"\$HOME/.nvm/nvm.sh\" >/dev/null 2>&1; fi; \
             cd ${DEPLOY_PATH}; \
             npm ci --omit=dev --ignore-scripts --no-audit --no-fund; \
             chmod +x restart-production-runtime.sh; \
             ./restart-production-runtime.sh"

          rm /tmp/deploy_key
          echo "backup=/tmp/${BACKUP_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Production smoke
        run: |
          set -euo pipefail
          ASSET_VERSION="${{ steps.version.outputs.VERSION }}-${GITHUB_SHA::12}"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/privacy.html)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/features/agents.html)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/docs/first-run.html)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/llms.txt)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/feed.xml)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/releases.xml)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/service-worker.js)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://cocxy.dev/health)" = "200"
          REDIRECT_STATUS="$(curl -fsS -o /dev/null -w '%{http_code}' -I https://cocxy.dev/getting-started.html)"
          test "$REDIRECT_STATUS" = "301"
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          curl -fsSL https://cocxy.dev/ -o "$SMOKE_DIR/home.html"
          curl -fsSL https://cocxy.dev/privacy.html -o "$SMOKE_DIR/privacy.html"
          curl -fsSL https://cocxy.dev/sitemap.xml -o "$SMOKE_DIR/sitemap.xml"
          curl -fsSL https://cocxy.dev/robots.txt -o "$SMOKE_DIR/robots.txt"
          curl -fsSL https://cocxy.dev/llms.txt -o "$SMOKE_DIR/llms.txt"
          curl -fsSL https://cocxy.dev/feed.xml -o "$SMOKE_DIR/feed.xml"
          curl -fsSL https://cocxy.dev/releases.xml -o "$SMOKE_DIR/releases.xml"
          curl -fsSL https://cocxy.dev/service-worker.js -o "$SMOKE_DIR/service-worker.js"
          grep -q "style.css?v=${ASSET_VERSION}" "$SMOKE_DIR/home.html"
          grep -q "CocxyTerminal-${{ steps.version.outputs.VERSION }}.dmg" "$SMOKE_DIR/home.html"
          grep -q "releases/download/v${{ steps.version.outputs.VERSION }}/CocxyTerminal-${{ steps.version.outputs.VERSION }}.dmg" "$SMOKE_DIR/home.html"
          grep -q "Download v${{ steps.version.outputs.VERSION }}" "$SMOKE_DIR/home.html"
          ! grep -Fq "v0.0.0" "$SMOKE_DIR/home.html"
          ! grep -Fq "v0.0.0" "$SMOKE_DIR/privacy.html"
          grep -q "Version: ${{ steps.version.outputs.VERSION }}" "$SMOKE_DIR/llms.txt"
          grep -q "<rss version=\"2.0\"" "$SMOKE_DIR/feed.xml"
          grep -q "Cocxy Terminal Releases" "$SMOKE_DIR/releases.xml"
          grep -q "PRECACHE_URLS" "$SMOKE_DIR/service-worker.js"
          grep -q "cocxy-web-static-v${ASSET_VERSION}" "$SMOKE_DIR/service-worker.js"
          grep -q "style.css?v=${ASSET_VERSION}" "$SMOKE_DIR/service-worker.js"
          ! grep -Fq "v0.0.0" "$SMOKE_DIR/service-worker.js"
          grep -q "No telemetry pipeline" "$SMOKE_DIR/privacy.html"
          grep -q "https://cocxy.dev/privacy.html" "$SMOKE_DIR/sitemap.xml"
          grep -q "Sitemap: https://cocxy.dev/sitemap.xml" "$SMOKE_DIR/robots.txt"
