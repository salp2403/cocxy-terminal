name: Performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start:
    name: Cold start smoke budget
    runs-on: macos-15
    timeout-minutes: 75
    env:
      COCXY_COLD_START_BUDGET_MS: "800"
      COCXY_COLD_START_INTERNAL_BUDGET_MS: "125"
      COCXY_PERFORMANCE_BASELINE: scripts/performance-baselines.macos15-ci.json
      COCXY_SYNTAX_INCREMENTAL_PARSE_BUDGET_MS: "20"
      COCXYCORE_OUTPUT_THROUGHPUT_BUDGET_MBPS: "0.8"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install Zig 0.15.2
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2

      - name: Install pinned XcodeGen
        run: |
          XCODEGEN_BIN="$(./scripts/install-pinned-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.45.3")"
          echo "$XCODEGEN_BIN" >> "$GITHUB_PATH"

      - name: Prepare inert CI remote-daemon fixture
        run: ./scripts/prepare-ci-cocxycore-fixture.sh "$RUNNER_TEMP/cocxycore-ci-fixture"

      - name: Build app bundle
        env:
          COCXYCORE_DIR: ${{ runner.temp }}/cocxycore-ci-fixture
          COCXY_CI_REMOTE_DAEMON_FIXTURE: "1"
        run: ./scripts/build-app.sh debug

      - name: Measure cold start
        run: |
          set -euo pipefail
          mkdir -p build/performance
          chmod +x scripts/bench-cold-start.sh
          scripts/bench-cold-start.sh --app build/CocxyTerminal.app --runs 5 --enforce | tee build/performance/cold-start.json

      - name: Cleanup CocxyTerminal processes
        if: always()
        run: pkill -x CocxyTerminal || true

      - name: Measure memory baseline
        run: |
          set -euo pipefail
          mkdir -p build/performance
          chmod +x scripts/bench-memory-baseline.sh
          scripts/bench-memory-baseline.sh --app build/CocxyTerminal.app --enforce | tee build/performance/memory-baseline.json

      - name: Run performance benchmark suite
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p build/performance
          chmod +x scripts/run-performance-benchmarks.sh scripts/run-cocxycore-benchmarks.sh
          scripts/run-performance-benchmarks.sh 2>&1 | tee build/performance/benchmark-suite.log

      - name: Check performance regression baselines
        run: |
          scripts/check-performance-regression.py \
            --baseline "$COCXY_PERFORMANCE_BASELINE" \
            --metric-file build/performance/cold-start.json \
            --metric-file build/performance/memory-baseline.json \
            --log-file build/performance/benchmark-suite.log \
            --enforce
