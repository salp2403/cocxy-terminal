  <g filter="url(#shadow)"><rect x="72" y="212" width="230" height="88" rx="14" fill="url(#card)" stroke="#5b5e72"/><text x="94" y="246" fill="#eef1ff" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">SwiftUI Panels</text><text x="94" y="270" fill="#aab0c6" font-family="Inter, -apple-system, sans-serif" font-size="14">Vault · review · docs</text></g>
  <g filter="url(#shadow)"><rect x="345" y="202" width="230" height="108" rx="14" fill="url(#card)" stroke="#5b5e72"/><text x="367" y="236" fill="#eef1ff" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">Domain Services</text><text x="367" y="260" fill="#aab0c6" font-family="Inter, -apple-system, sans-serif" font-size="14">agents · browser · remote</text></g>
  <g filter="url(#shadow)"><rect x="618" y="212" width="230" height="88" rx="14" fill="url(#card)" stroke="#5b5e72"/><text x="640" y="246" fill="#eef1ff" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">CocxyCore ABI</text><text x="640" y="270" fill="#aab0c6" font-family="Inter, -apple-system, sans-serif" font-size="14">Zig core through C</text></g>
  <g filter="url(#shadow)"><rect x="110" y="392" width="200" height="74" rx="14" fill="url(#card)" stroke="#5b5e72"/><text x="132" y="426" fill="#eef1ff" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">Local Stores</text><text x="132" y="450" fill="#aab0c6" font-family="Inter, -apple-system, sans-serif" font-size="14">Keychain · files · SQLite</text></g>
  <g filter="url(#shadow)"><rect x="360" y="392" width="200" height="74" rx="14" fill="url(#card)" stroke="#5b5e72"/><text x="382" y="426" fill="#eef1ff" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">Metal Renderer</text><text x="382" y="450" fill="#aab0c6" font-family="Inter, -apple-system, sans-serif" font-size="14">glyph atlas · frames</text></g>
